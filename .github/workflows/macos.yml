name: macOS build and release
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish v0.1.5 developer-preview DMG and ZIP after all checks pass
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Public source checks
        run: python3 Scripts/check-source.py
      - name: Synthetic unit and subprocess tests
        run: swift test
      - name: Installer safety simulations
        run: python3 Scripts/test-build-dmg.py
      - name: Build and verify universal app
        id: package
        run: bash Scripts/build-app.sh --universal
      - name: Native demo startup and orderly-exit smoke test
        run: |
          python3 - <<'PYSMOKE'
          import subprocess
          for scenario in ([], ["--smoke-empty"], ["--smoke-many"], ["--rainbow"]):
              process = subprocess.Popen(
                  ["dist/Codex Notch Meter.app/Contents/MacOS/CodexNotchMeter", "--smoke-test", *scenario],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              try:
                  stdout, stderr = process.communicate(timeout=25)
              except subprocess.TimeoutExpired:
                  # Sample only our still-owned synthetic app; do not alter the success deadline.
                  print("Native smoke exceeded the 25-second deadline", flush=True)
                  try:
                      sample = subprocess.run(
                          ["/usr/bin/sample", str(process.pid), "1", "1"],
                          capture_output=True, text=True, timeout=5,
                      )
                      print(sample.stdout[:30000])
                      print(sample.stderr[:2000])
                  except (OSError, subprocess.TimeoutExpired) as error:
                      print("Owned-process stack sample unavailable:", type(error).__name__)
                  finally:
                      process.kill()
                      stdout, stderr = process.communicate(timeout=5)
                  print(stdout)
                  print(stderr)
                  raise SystemExit("Native app smoke test timed out")
              print(stdout)
              print(stderr)
              if process.returncode != 0:
                  raise SystemExit("Native app smoke test exited unsuccessfully")
              if "SMOKE_OK: native island geometry, expansion and orderly shutdown completed; demo-only" not in stdout:
                  raise SystemExit("Native app smoke test did not confirm startup and orderly exit")
          PYSMOKE
      - name: Native transparent contour and live-update pixel gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-contour.py
      - name: Raw-edge native alignment and calibration gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-alignment.py
      - name: Native hover cadence and continuous reversal gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-motion.py
      - name: Build and inspect drag-to-Applications installer
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/build-dmg.py
      - name: Retain synthetic native rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodexNotchMeter-native-contour-evidence
          path: dist/contour-rendering/**/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified developer preview
        uses: actions/upload-artifact@v4
        with:
          name: CodexNotchMeter-developer-preview
          path: |
            dist/CodexNotchMeter-0.1.5-universal.zip
            dist/CodexNotchMeter-0.1.5-universal.zip.sha256
            dist/CodexNotchMeter-0.1.5-universal.dmg
            dist/CodexNotchMeter-0.1.5-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 7
  official-desktop:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only signed official desktop helper discovery
        run: python3 Scripts/inspect-official-desktop.py
  release:
    if: ${{ inputs.publish_release }}
    needs: [build, official-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CodexNotchMeter-developer-preview
          path: dist
      - name: Verify archive checksum
        working-directory: dist
        run: |
          sha256sum --check CodexNotchMeter-0.1.5-universal.zip.sha256
          sha256sum --check CodexNotchMeter-0.1.5-universal.dmg.sha256
      - name: Publish developer preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0.1.5" --jq '.[] | select(.ref == "refs/tags/v0.1.5") | .ref')"
          existing_release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.1.5") | .id')"
          if [[ -n "$existing_tag" || -n "$existing_release" ]]; then
            echo "Refusing to replace an existing v0.1.5 tag or release." >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          ## Codex Notch Meter v0.1.5
          悬停动效迭代预览：macOS 14+ 按显示刷新同步几何更新，macOS 13 保留 60 Hz 定时回退；预先布局不参与尺寸计算的详情内容，减少每帧强制布局，并用连续弹簧保留反向运动速度。收起途中移回鼠标会立即恢复展开，首次悬停仍保留停留判定。
          保留 v0.1.4 的原始边界对齐与默认零偏移校准、五款皮肤、流光彩虹、左侧剩余进度、纯黑已用段、DMG 和可选登录时启动。颜色时钟仍最多 15 fps，与短时几何动画独立。

          优先下载 Universal DMG，将 .app 拖到 Applications，再从“应用程序”打开；ZIP 仍可选。两种产物均包含 Apple Silicon / Intel 二进制。
          登录时启动默认关闭，仅由用户点击请求启用；macOS 可能要求批准或拒绝临时签名。安装映像与测试不会注册登录项。
          需要 macOS 13+ 和已登录 ChatGPT 账户的官方 Codex 桌面应用或 CLI。未知桌面打包布局会安全报错。

          **开发预览 / Developer preview:** 仅使用 ad-hoc 临时签名，没有 Apple Developer ID 签名或公证。
          macOS 可能阻止下载产物启动。项目不提供关闭 Gatekeeper 或绕过安全检查的指令。
          Native compile, synthetic tests, dual-architecture packaging, signature checks, and demo-only native geometry, drawing, motion, Quit-layout and shutdown checks passed in this workflow.
          Read-only inspection of the current official signed desktop DMG resolved its bundled helper within the production deadline; no downloaded Codex executable or account session was started.
          All five skins passed native 1x/2x full-U contour alpha/color/arc/live-selection/phase gates. Remaining fills from the left; the consumed right suffix is pure black. A shared maximum-15fps color scheduler passed synthetic lifecycle pause/resume checks.
          Raw-edge native pixel-axis and mirrored-corner checks passed for off-center, odd/even/fractional inputs, signed calibration and reset; the recreated old edge-rounding control was rejected. Forced 1x/2x captures are not physical Retina placement tests.
          Native motion checks sampled applied frames, normal-run-loop view/presentation bounds, callback cadence, reversals and retired-source cleanup under synthetic UI updates. The baseline reproduces the old drawing/layout strategy with the new spring, not the full old binary. Timing evidence does not establish perceived smoothness on a physical Mac; macOS 13 fallback is exercised on the hosted newer OS.
          Synthetic login-state tests passed without real registration; actual login/reboot behavior remains unverified. The DMG was mounted read-only and its app bytes, signature, architectures and Applications link verified. Synthetic rendering evidence is retained in the workflow artifact, not a physical-Mac screenshot.
          The user reported successful quota reads with v0.1.1; CI never accesses an account. Physical notch appearance/interaction still requires separate verification.
          NOTES
          # Atomic ref creation prevents a concurrent run from reusing this version.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v0.1.5" -f sha="$RELEASE_COMMIT" --silent
          gh release create v0.1.5 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v0.1.5 · macOS Developer Preview" \
            --prerelease \
            --notes-file notes.md \
            dist/CodexNotchMeter-0.1.5-universal.zip \
            dist/CodexNotchMeter-0.1.5-universal.zip.sha256 \
            dist/CodexNotchMeter-0.1.5-universal.dmg \
            dist/CodexNotchMeter-0.1.5-universal.dmg.sha256
