name: macOS build and release
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish v1.1.3 DMG and ZIP after all checks pass
        type: boolean
        required: true
        default: false
      stage_draft:
        description: Stage this successful run's exact assets and synthetic PNGs as a private draft for review
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixed v1.0.0 comparison is archived locally, never substituted.
          fetch-depth: 0
          persist-credentials: false
      - name: Reject conflicting release modes
        if: ${{ inputs.publish_release && inputs.stage_draft }}
        run: |
          echo "publish_release and stage_draft are mutually exclusive." >&2
          exit 1
      - name: Toolchain
        run: swift --version
      - name: Public source checks
        run: python3 Scripts/check-source.py
      - name: Debug capture privacy/parser safety tests
        run: python3 Scripts/check-debug-capture.py --self-test
      - name: Release source binding safety tests
        run: python3 Scripts/test-verify-release-source.py
      - name: Synthetic Music dictionary discovery safety tests
        run: python3 Scripts/test-music-dictionary.py
      - name: Inspect public Music scripting dictionary without launch
        run: python3 Scripts/check-music-dictionary.py
      - name: Synthetic unit and subprocess tests
        run: swift test
      - name: Installer safety simulations
        run: python3 Scripts/test-build-dmg.py
      - name: Build and verify universal app
        id: package
        run: bash Scripts/build-app.sh --universal
      - name: Native debug capture instrumentation and lifecycle fixture
        run: python3 Scripts/check-debug-capture.py --app "dist/Codex Notch Meter.app/Contents/MacOS/CodexNotchMeter"
      - name: Native demo startup and orderly-exit smoke test
        run: |
          python3 - <<'PYSMOKE'
          import subprocess
          for scenario in ([], ["--smoke-empty"], ["--smoke-many"], ["--rainbow"]):
              process = subprocess.Popen(
                  ["dist/Codex Notch Meter.app/Contents/MacOS/CodexNotchMeter", "--smoke-test", *scenario],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              try:
                  stdout, stderr = process.communicate(timeout=25)
              except subprocess.TimeoutExpired:
                  # Sample only our still-owned synthetic app; do not alter the success deadline.
                  print("Native smoke exceeded the 25-second deadline", flush=True)
                  try:
                      sample = subprocess.run(
                          ["/usr/bin/sample", str(process.pid), "1", "1"],
                          capture_output=True, text=True, timeout=5,
                      )
                      print(sample.stdout[:30000])
                      print(sample.stderr[:2000])
                  except (OSError, subprocess.TimeoutExpired) as error:
                      print("Owned-process stack sample unavailable:", type(error).__name__)
                  finally:
                      process.kill()
                      stdout, stderr = process.communicate(timeout=5)
                  print(stdout)
                  print(stderr)
                  raise SystemExit("Native app smoke test timed out")
              print(stdout)
              print(stderr)
              if process.returncode != 0:
                  raise SystemExit("Native app smoke test exited unsuccessfully")
              if "SMOKE_OK: native island geometry, expansion and orderly shutdown completed; demo-only" not in stdout:
                  raise SystemExit("Native app smoke test did not confirm startup and orderly exit")
          PYSMOKE
      - name: Native transparent contour and live-update pixel gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-contour.py
      - name: Raw-edge native alignment and calibration gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-alignment.py
      - name: Native hover cadence and continuous reversal gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-motion.py
      - name: Native ordinary hover and interrupted-width handoff gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-ordinary.py --self-test
          python3 Scripts/check-native-ordinary.py
      - name: Native close endpoint and tail-pixel gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-collapse.py
      - name: Native compact refresh and promotion gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-updates.py --self-test
          python3 Scripts/check-native-updates.py
      - name: Native optional Music lyrics safety and priority gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-music.py
      - name: Native v1.0.3 lyrics recovery regression red-green gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-lyrics-recovery.py --self-test
          python3 Scripts/check-native-lyrics-recovery.py
          python3 Scripts/check-native-lyrics-redgreen.py --self-test
          python3 Scripts/check-native-lyrics-redgreen.py
      - name: Native rejected lyric gesture recovery red-green gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-gesture-recovery.py --self-test
          python3 Scripts/check-native-gesture-recovery.py --red-green
      - name: Native mixed-source stationary Music hover regression gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-stationary-music.py --self-test
          python3 Scripts/check-native-stationary-music.py --red-green
      - name: Native wide-music-shell quota hover stability gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-music-quota-hover.py --self-test
          python3 Scripts/check-native-music-quota-hover.py --red-green
      - name: Native Music details visible-side width regression gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-music-details-width.py --self-test
          python3 Scripts/check-native-music-details-width.py --red-green
      - name: Native Music render cache and event-poll recovery gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-music-cache.py --self-test
          python3 Scripts/check-native-music-cache.py
      - name: Native queued pointer ingress and closed music height gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-pointer.py --self-test
          python3 Scripts/check-native-pointer.py
      - name: Native v1.0.0 same-input animation comparison
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-baseline.py --self-test
          python3 Scripts/check-native-baseline.py
      - name: Native display compatibility and lifecycle gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-displays.py
      - name: Build and inspect drag-to-Applications installer
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/build-dmg.py
      - name: Retain synthetic native rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodexNotchMeter-native-contour-evidence
          path: |
            dist/contour-rendering/**/*.png
            dist/music-details-width/**/*
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified developer preview
        uses: actions/upload-artifact@v4
        with:
          name: CodexNotchMeter-developer-preview
          path: |
            dist/CodexNotchMeter-1.1.3-universal.zip
            dist/CodexNotchMeter-1.1.3-universal.zip.sha256
            dist/CodexNotchMeter-1.1.3-universal.dmg
            dist/CodexNotchMeter-1.1.3-universal.dmg.sha256
            dist/release-source.json
          if-no-files-found: error
          retention-days: 7
  official-desktop:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only signed official desktop helper discovery
        run: python3 Scripts/inspect-official-desktop.py
  release:
    if: ${{ inputs.publish_release || inputs.stage_draft }}
    needs: [build, official-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CodexNotchMeter-developer-preview
          path: dist
      - uses: actions/download-artifact@v4
        if: ${{ inputs.stage_draft }}
        with:
          name: CodexNotchMeter-native-contour-evidence
          path: dist/evidence
      - name: Prepare synthetic review images
        if: ${{ inputs.stage_draft }}
        run: |
          python3 - <<'PYPNG'
          from pathlib import Path
          import shutil
          sources = sorted(Path("dist/evidence").rglob("perimeter-*.png"))
          expected = {f"perimeter-{state}-{theme}.png" for state in ("compact", "details", "details-no-wings")
                      for theme in ("standard", "rainbow", "aurora", "sunset", "ice")}
          expected |= {f"perimeter-motion-{direction}-{i}.png" for direction in ("open", "close") for i in (1, 2, 3)}
          expected |= {f"perimeter-ordinary-{direction}-{i}.png" for direction in ("open", "close") for i in (1, 2, 3)}
          expected |= {f"perimeter-indicator-{state}.png" for state in ("playing-a", "playing-b", "paused", "reduced-motion")}
          expected.add("perimeter-closed-artwork.png")
          expected |= {f"perimeter-closed-height-{state}-raw-mask.png" for state in ("normal", "music")}
          if len(sources) != len(expected) or {p.name for p in sources} != expected:
              raise SystemExit("Exact synthetic review PNG set is missing or duplicated")
          for source in sources:
              if source.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("Invalid PNG signature")
              shutil.copyfile(source, Path("dist") / source.name)
          PYPNG
      - name: Verify archive checksum
        working-directory: dist
        run: |
          sha256sum --check CodexNotchMeter-1.1.3-universal.zip.sha256
          sha256sum --check CodexNotchMeter-1.1.3-universal.dmg.sha256
      - name: Verify exact source and asset manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          STAGE_DRAFT: ${{ inputs.stage_draft }}
        run: |
          review_options=()
          if [[ "$STAGE_DRAFT" == "true" ]]; then review_options+=(--require-review-images); fi
          python3 Scripts/verify-release-source.py --source-commit "$RELEASE_COMMIT" --source-run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY" --checkout . --dist dist --version 1.1.3 --bundle-build 20 --asset-manifest dist/release-assets.json "${review_options[@]}"
      - name: Publish release or stage private draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          STAGE_DRAFT: ${{ inputs.stage_draft }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [[ "$STAGE_DRAFT" == "true" && "$PUBLISH_RELEASE" == "true" ]]; then
            echo "Refusing conflicting release modes." >&2
            exit 1
          fi
          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v1.1.3" --jq '.[] | select(.ref == "refs/tags/v1.1.3") | .ref')"
          existing_release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.1.3") | .id')"
          if [[ -n "$existing_tag" || -n "$existing_release" ]]; then
            echo "Refusing to replace an existing v1.1.3 tag or release." >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          ## Codex Notch Meter v1.1.3

          ### 中文

          v1.1.3/build 20 包含音乐悬停稳定性修正和可选歌词补充源。仅在最终提交的完整 macOS 自动检查通过后发布，不覆盖旧版 1.1.2。

          - 修正宽音乐翼缘进入额度展开轮廓时，静止指针可能因轮廓变化反复开合的问题；保留真实移出、暂停和播放新鲜度失效边界。
          - 在线歌词继续优先使用 LRCLIB；AMLL 是独立开关、默认关闭的可选补充源，需要单独同意。覆盖范围取决于来源收录与匹配结果，不保证每首歌都有歌词。
          - 明确设置窗口打开时的歌词交互提示，并补充跨曲、撤销同意、本地导入与迟到结果隔离检查。
          - 保留额度提示原时长。暂停验收等待界面处理完暂停后，检查原提示计时器身份和到期时间不变，而不是误把音乐附件动画重定向当作提示重启。

          ### English

          v1.1.3/build 20 includes music-hover stability changes and an optional lyrics fallback. Publication requires the complete automated macOS checks on the final commit; v1.1.2 is preserved.

          - Retain eligible music-origin hover geometry while quota details expand, preventing a stationary pointer on wide music wings from being dropped by the changing contour. Real exits, pause and playback-freshness boundaries remain enforced.
          - LRCLIB remains the primary online lyrics source. AMLL is a separately consented, independently controlled fallback that is off by default. Coverage depends on source availability and matching; lyrics are not guaranteed for every track.
          - Clarify lyrics interaction while Settings is open, with additional cross-track, consent-revocation, local-import and late-result isolation checks.
          - Preserve quota-notice duration. Pause verification now waits for the panel to consume pause and checks the original notice timer identity and expiry, instead of confusing accessory-animation retargeting with a restarted notice.

          ### Validation and limits / 验证与边界

          完整自动验收包括 Swift 测试、原生应用内回归、旧版失败/新版通过检查、Universal 构建及源代码绑定的 ZIP/DMG 核验。自动检查仍使用模拟播放数据、应用内事件和自身视图捕获，不能等同系统全局手势或用户现场验收。

          真实系统 Music、TCC 权限、流媒体和用户 Mac 尚未实测；自动生成截图尚未完成人工检查。先前 #77 的轮询迟到根因仍未证明，后续通过只代表对应运行未复现。用户已知这些缺口并允许自动检查全部通过后发布；本版不宣称用户现场问题已全部解决，也不宣称全部验证边界已满足。

          Automated acceptance covers Swift tests, native in-app regressions, old-red/new-green checks, universal builds and source-bound ZIP/DMG verification. Synthetic playback, own-app events and own-view captures are not proof of system-wide physical gestures or field behavior.

          Real system Music, TCC, streaming and the user's Mac remain untested. Generated screenshots have not received manual visual review. The root cause of the earlier run #77 polling delay remains unproven; later passing runs establish non-reproduction only. The user authorized publication after all automated checks pass with these gaps disclosed. This release does not claim every reported field issue is resolved or every validation boundary has been satisfied.

          需要 macOS 13+；Universal DMG/ZIP 包含 Apple Silicon 与 Intel 二进制。仅 ad-hoc 签名，无 Developer ID 签名或 Apple 公证；macOS 可能阻止启动。请勿关闭系统安全保护。

          Requires macOS 13+. Universal DMG/ZIP packages include Apple Silicon and Intel binaries. Ad-hoc signed only, without Developer ID signing or Apple notarization; macOS may block launch. Do not disable system security protections.
          NOTES
          # Atomic ref creation prevents a concurrent run from reusing this version.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v1.1.3" -f sha="$RELEASE_COMMIT" --silent
          release_options=()
          review_assets=()
          if [[ "$STAGE_DRAFT" == "true" ]]; then
            release_options+=(--draft)
            review_assets=(dist/perimeter-*.png)
          fi
          gh release create v1.1.3 \
            "${release_options[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v1.1.3 · Stable Music Hover & Optional AMLL Lyrics" \
            --notes-file notes.md \
            dist/CodexNotchMeter-1.1.3-universal.zip \
            dist/CodexNotchMeter-1.1.3-universal.zip.sha256 \
            dist/CodexNotchMeter-1.1.3-universal.dmg \
            dist/CodexNotchMeter-1.1.3-universal.dmg.sha256 \
            dist/release-source.json \
            dist/release-assets.json \
            "${review_assets[@]}"
