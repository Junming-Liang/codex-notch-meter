name: macOS build and release
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish v1.0.2 DMG and ZIP after all checks pass
        type: boolean
        required: true
        default: false
      stage_draft:
        description: Stage this successful run's exact assets and synthetic PNGs as a private draft for review
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject conflicting release modes
        if: ${{ inputs.publish_release && inputs.stage_draft }}
        run: |
          echo "publish_release and stage_draft are mutually exclusive." >&2
          exit 1
      - name: Toolchain
        run: swift --version
      - name: Public source checks
        run: python3 Scripts/check-source.py
      - name: Release source binding safety tests
        run: python3 Scripts/test-verify-release-source.py
      - name: Synthetic Music dictionary discovery safety tests
        run: python3 Scripts/test-music-dictionary.py
      - name: Inspect public Music scripting dictionary without launch
        run: python3 Scripts/check-music-dictionary.py
      - name: Synthetic unit and subprocess tests
        run: swift test
      - name: Installer safety simulations
        run: python3 Scripts/test-build-dmg.py
      - name: Build and verify universal app
        id: package
        run: bash Scripts/build-app.sh --universal
      - name: Native demo startup and orderly-exit smoke test
        run: |
          python3 - <<'PYSMOKE'
          import subprocess
          for scenario in ([], ["--smoke-empty"], ["--smoke-many"], ["--rainbow"]):
              process = subprocess.Popen(
                  ["dist/Codex Notch Meter.app/Contents/MacOS/CodexNotchMeter", "--smoke-test", *scenario],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              try:
                  stdout, stderr = process.communicate(timeout=25)
              except subprocess.TimeoutExpired:
                  # Sample only our still-owned synthetic app; do not alter the success deadline.
                  print("Native smoke exceeded the 25-second deadline", flush=True)
                  try:
                      sample = subprocess.run(
                          ["/usr/bin/sample", str(process.pid), "1", "1"],
                          capture_output=True, text=True, timeout=5,
                      )
                      print(sample.stdout[:30000])
                      print(sample.stderr[:2000])
                  except (OSError, subprocess.TimeoutExpired) as error:
                      print("Owned-process stack sample unavailable:", type(error).__name__)
                  finally:
                      process.kill()
                      stdout, stderr = process.communicate(timeout=5)
                  print(stdout)
                  print(stderr)
                  raise SystemExit("Native app smoke test timed out")
              print(stdout)
              print(stderr)
              if process.returncode != 0:
                  raise SystemExit("Native app smoke test exited unsuccessfully")
              if "SMOKE_OK: native island geometry, expansion and orderly shutdown completed; demo-only" not in stdout:
                  raise SystemExit("Native app smoke test did not confirm startup and orderly exit")
          PYSMOKE
      - name: Native transparent contour and live-update pixel gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-contour.py
      - name: Raw-edge native alignment and calibration gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-alignment.py
      - name: Native hover cadence and continuous reversal gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-motion.py
      - name: Native close endpoint and tail-pixel gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-collapse.py
      - name: Native compact refresh and promotion gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-updates.py --self-test
          python3 Scripts/check-native-updates.py
      - name: Native optional Music lyrics safety and priority gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-music.py
      - name: Native display compatibility and lifecycle gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-displays.py
      - name: Build and inspect drag-to-Applications installer
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/build-dmg.py
      - name: Retain synthetic native rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodexNotchMeter-native-contour-evidence
          path: dist/contour-rendering/**/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified developer preview
        uses: actions/upload-artifact@v4
        with:
          name: CodexNotchMeter-developer-preview
          path: |
            dist/CodexNotchMeter-1.0.2-universal.zip
            dist/CodexNotchMeter-1.0.2-universal.zip.sha256
            dist/CodexNotchMeter-1.0.2-universal.dmg
            dist/CodexNotchMeter-1.0.2-universal.dmg.sha256
            dist/release-source.json
          if-no-files-found: error
          retention-days: 7
  official-desktop:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only signed official desktop helper discovery
        run: python3 Scripts/inspect-official-desktop.py
  release:
    if: ${{ inputs.publish_release || inputs.stage_draft }}
    needs: [build, official-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CodexNotchMeter-developer-preview
          path: dist
      - uses: actions/download-artifact@v4
        if: ${{ inputs.stage_draft }}
        with:
          name: CodexNotchMeter-native-contour-evidence
          path: dist/evidence
      - name: Prepare synthetic review images
        if: ${{ inputs.stage_draft }}
        run: |
          python3 - <<'PYPNG'
          from pathlib import Path
          import shutil
          sources = sorted(Path("dist/evidence").rglob("perimeter-*.png"))
          expected = {f"perimeter-{state}-{theme}.png" for state in ("compact", "details", "details-no-wings")
                      for theme in ("standard", "rainbow", "aurora", "sunset", "ice")}
          expected |= {f"perimeter-motion-{direction}-{i}.png" for direction in ("open", "close") for i in (1, 2, 3)}
          expected.add("perimeter-closed-artwork.png")
          if len(sources) != len(expected) or {p.name for p in sources} != expected:
              raise SystemExit("Exact synthetic review PNG set is missing or duplicated")
          for source in sources:
              if source.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("Invalid PNG signature")
              shutil.copyfile(source, Path("dist") / source.name)
          PYPNG
      - name: Verify archive checksum
        working-directory: dist
        run: |
          sha256sum --check CodexNotchMeter-1.0.2-universal.zip.sha256
          sha256sum --check CodexNotchMeter-1.0.2-universal.dmg.sha256
      - name: Verify exact source and asset manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          STAGE_DRAFT: ${{ inputs.stage_draft }}
        run: |
          review_options=()
          if [[ "$STAGE_DRAFT" == "true" ]]; then review_options+=(--require-review-images); fi
          python3 Scripts/verify-release-source.py --source-commit "$RELEASE_COMMIT" --source-run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY" --checkout . --dist dist --version 1.0.2 --bundle-build 15 --asset-manifest dist/release-assets.json "${review_options[@]}"
      - name: Publish release or stage private draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          STAGE_DRAFT: ${{ inputs.stage_draft }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [[ "$STAGE_DRAFT" == "true" && "$PUBLISH_RELEASE" == "true" ]]; then
            echo "Refusing conflicting release modes." >&2
            exit 1
          fi
          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v1.0.2" --jq '.[] | select(.ref == "refs/tags/v1.0.2") | .ref')"
          existing_release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.0.2") | .id')"
          if [[ -n "$existing_tag" || -n "$existing_release" ]]; then
            echo "Refusing to replace an existing v1.0.2 tag or release." >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          ## Codex Notch Meter v1.0.2

          ### 中文

          修复音乐状态下的外轮廓、无按键划过手势和展开抖动：

          - 额度进度沿整个音乐黑色外壳绘制，紧凑封面、展开歌词和音乐详情共用同一轮廓。已用部分纯黑，保留五款皮肤；音乐详情不再重复显示内部横向进度条。
          - 快速从左向右划过顶部可以打开匹配歌词，反向划过关闭。补充只读鼠标事件观察和跨采样边缘判断，避免漏掉快速轨迹；不新增辅助功能或屏幕录制权限。
          - 手势完成后，指针继续移到邻近或下方不会被普通悬停抢走状态，避免突然放大成详情又缩回。离开整个外壳后重新悬停，仍可正常查看详情。
          - 暂停、恢复及设置暂时隐藏时，配件宽度与外壳共用同一帧驱动，避免布尔尺寸跳变。保留默认小封面/播放指示、歌词 B 布局、额度提示优先及2/4/6秒停留。

          - 修复额度通知设置 6 秒却一闪即逝的路径：普通鼠标移入移出不再抢占提示，慢绘制会重试而非在 250ms 后撤销；2/4/6 秒从稳定绘制确认后开始计算。保留未变化读取不撤销提示，新变化按自身已捕获时长重新显示。

          ### English

          Fixes the music perimeter, button-free pointer gestures, and unstable expansion:

          - One shared shell draws the body and quota perimeter around compact playback, expanded lyrics and music details. Used quota stays black; all five skins remain. Music details no longer duplicate progress as interior horizontal bars.
          - Fast left-to-right pointer crossings open eligible lyrics, and reverse crossings close them. Read-only mouse observation and segment-based boundary handling avoid missed samples without new Accessibility or Screen Recording permission.
          - Natural adjacent/downward movement after a gesture no longer promotes the same interaction into full hover details. Leaving the full shell and returning still supports ordinary hover.
          - Playback accessory width and expansion share the frame driver through pause/resume and temporary suppression. Compact artwork, the B lyric layout, quota-notice priority and the 2/4/6-second holds remain.

          - Prevents configured six-second quota notices from flashing away: passive pointer movement cannot interrupt the notice, and slow paint retries instead of dismissing after 250ms. The 2/4/6-second hold starts after settled paint acknowledgment; unchanged reads retain the notice, while a new change receives its own captured dwell.

          ### Validation and limits / 验证与边界

          This release is intended to be published only after its exact source passes macOS CI and its synthetic native PNGs are reviewed. Build-source metadata binds the packaged app to the commit, tree and workflow run; archive checksums identify the reviewed ZIP/DMG bytes. See the source-linked workflow and `docs/VALIDATION.md` for observed results, rather than treating this note as an unverified test receipt.

          Native tests use original synthetic lyrics/artwork, injected playback and the app's own view captures. They do not access a user's account, Music library or screen. Passing them does not establish physical-display smoothness, all Music/TCC/streaming combinations, macOS 13 runtime, or real login/reboot behavior.

          需要 macOS 13+，Universal DMG/ZIP 包含 Apple Silicon 与 Intel 二进制。仅 ad-hoc 签名，没有 Developer ID 签名或公证；macOS 可能阻止启动。本项目不提供绕过安全检查的指令。可选歌词与在线匹配仍默认关闭，LRCLIB 需要单独同意发送当前歌曲信息，社区歌词不等于 Apple 官方歌词。

          Requires macOS 13+. Universal DMG/ZIP contains Apple Silicon and Intel binaries. Ad-hoc signed only, without Developer ID signing or notarization; macOS may block launch. No security-bypass instructions are provided. Optional lyrics and online lookup remain off by default; LRCLIB metadata sharing requires separate consent, and community lyrics are not Apple official lyrics.
          NOTES
          # Atomic ref creation prevents a concurrent run from reusing this version.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v1.0.2" -f sha="$RELEASE_COMMIT" --silent
          release_options=()
          review_assets=()
          if [[ "$STAGE_DRAFT" == "true" ]]; then
            release_options+=(--draft)
            review_assets=(dist/perimeter-*.png)
          fi
          gh release create v1.0.2 \
            "${release_options[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v1.0.2 · Music Interaction Fix" \
            --notes-file notes.md \
            dist/CodexNotchMeter-1.0.2-universal.zip \
            dist/CodexNotchMeter-1.0.2-universal.zip.sha256 \
            dist/CodexNotchMeter-1.0.2-universal.dmg \
            dist/CodexNotchMeter-1.0.2-universal.dmg.sha256 \
            dist/release-source.json \
            dist/release-assets.json \
            "${review_assets[@]}"
