name: macOS build and release
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish v1.0.3 DMG and ZIP after all checks pass
        type: boolean
        required: true
        default: false
      stage_draft:
        description: Stage this successful run's exact assets and synthetic PNGs as a private draft for review
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixed v1.0.0 comparison is archived locally, never substituted.
          fetch-depth: 0
          persist-credentials: false
      - name: Reject conflicting release modes
        if: ${{ inputs.publish_release && inputs.stage_draft }}
        run: |
          echo "publish_release and stage_draft are mutually exclusive." >&2
          exit 1
      - name: Toolchain
        run: swift --version
      - name: Public source checks
        run: python3 Scripts/check-source.py
      - name: Release source binding safety tests
        run: python3 Scripts/test-verify-release-source.py
      - name: Synthetic Music dictionary discovery safety tests
        run: python3 Scripts/test-music-dictionary.py
      - name: Inspect public Music scripting dictionary without launch
        run: python3 Scripts/check-music-dictionary.py
      - name: Synthetic unit and subprocess tests
        run: swift test
      - name: Installer safety simulations
        run: python3 Scripts/test-build-dmg.py
      - name: Build and verify universal app
        id: package
        run: bash Scripts/build-app.sh --universal
      - name: Native demo startup and orderly-exit smoke test
        run: |
          python3 - <<'PYSMOKE'
          import subprocess
          for scenario in ([], ["--smoke-empty"], ["--smoke-many"], ["--rainbow"]):
              process = subprocess.Popen(
                  ["dist/Codex Notch Meter.app/Contents/MacOS/CodexNotchMeter", "--smoke-test", *scenario],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              try:
                  stdout, stderr = process.communicate(timeout=25)
              except subprocess.TimeoutExpired:
                  # Sample only our still-owned synthetic app; do not alter the success deadline.
                  print("Native smoke exceeded the 25-second deadline", flush=True)
                  try:
                      sample = subprocess.run(
                          ["/usr/bin/sample", str(process.pid), "1", "1"],
                          capture_output=True, text=True, timeout=5,
                      )
                      print(sample.stdout[:30000])
                      print(sample.stderr[:2000])
                  except (OSError, subprocess.TimeoutExpired) as error:
                      print("Owned-process stack sample unavailable:", type(error).__name__)
                  finally:
                      process.kill()
                      stdout, stderr = process.communicate(timeout=5)
                  print(stdout)
                  print(stderr)
                  raise SystemExit("Native app smoke test timed out")
              print(stdout)
              print(stderr)
              if process.returncode != 0:
                  raise SystemExit("Native app smoke test exited unsuccessfully")
              if "SMOKE_OK: native island geometry, expansion and orderly shutdown completed; demo-only" not in stdout:
                  raise SystemExit("Native app smoke test did not confirm startup and orderly exit")
          PYSMOKE
      - name: Native transparent contour and live-update pixel gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-contour.py
      - name: Raw-edge native alignment and calibration gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-alignment.py
      - name: Native hover cadence and continuous reversal gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-motion.py
      - name: Native close endpoint and tail-pixel gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-collapse.py
      - name: Native compact refresh and promotion gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-updates.py --self-test
          python3 Scripts/check-native-updates.py
      - name: Native optional Music lyrics safety and priority gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-music.py
      - name: Native queued pointer ingress and closed music height gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-pointer.py --self-test
          python3 Scripts/check-native-pointer.py
      - name: Native v1.0.0 same-input animation comparison
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-baseline.py --self-test
          python3 Scripts/check-native-baseline.py
      - name: Native display compatibility and lifecycle gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-displays.py
      - name: Build and inspect drag-to-Applications installer
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/build-dmg.py
      - name: Retain synthetic native rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodexNotchMeter-native-contour-evidence
          path: dist/contour-rendering/**/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified developer preview
        uses: actions/upload-artifact@v4
        with:
          name: CodexNotchMeter-developer-preview
          path: |
            dist/CodexNotchMeter-1.0.3-universal.zip
            dist/CodexNotchMeter-1.0.3-universal.zip.sha256
            dist/CodexNotchMeter-1.0.3-universal.dmg
            dist/CodexNotchMeter-1.0.3-universal.dmg.sha256
            dist/release-source.json
          if-no-files-found: error
          retention-days: 7
  official-desktop:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only signed official desktop helper discovery
        run: python3 Scripts/inspect-official-desktop.py
  release:
    if: ${{ inputs.publish_release || inputs.stage_draft }}
    needs: [build, official-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CodexNotchMeter-developer-preview
          path: dist
      - uses: actions/download-artifact@v4
        if: ${{ inputs.stage_draft }}
        with:
          name: CodexNotchMeter-native-contour-evidence
          path: dist/evidence
      - name: Prepare synthetic review images
        if: ${{ inputs.stage_draft }}
        run: |
          python3 - <<'PYPNG'
          from pathlib import Path
          import shutil
          sources = sorted(Path("dist/evidence").rglob("perimeter-*.png"))
          expected = {f"perimeter-{state}-{theme}.png" for state in ("compact", "details", "details-no-wings")
                      for theme in ("standard", "rainbow", "aurora", "sunset", "ice")}
          expected |= {f"perimeter-motion-{direction}-{i}.png" for direction in ("open", "close") for i in (1, 2, 3)}
          expected.add("perimeter-closed-artwork.png")
          expected |= {f"perimeter-closed-height-{state}-raw-mask.png" for state in ("normal", "music")}
          if len(sources) != len(expected) or {p.name for p in sources} != expected:
              raise SystemExit("Exact synthetic review PNG set is missing or duplicated")
          for source in sources:
              if source.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("Invalid PNG signature")
              shutil.copyfile(source, Path("dist") / source.name)
          PYPNG
      - name: Verify archive checksum
        working-directory: dist
        run: |
          sha256sum --check CodexNotchMeter-1.0.3-universal.zip.sha256
          sha256sum --check CodexNotchMeter-1.0.3-universal.dmg.sha256
      - name: Verify exact source and asset manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          STAGE_DRAFT: ${{ inputs.stage_draft }}
        run: |
          review_options=()
          if [[ "$STAGE_DRAFT" == "true" ]]; then review_options+=(--require-review-images); fi
          python3 Scripts/verify-release-source.py --source-commit "$RELEASE_COMMIT" --source-run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY" --checkout . --dist dist --version 1.0.3 --bundle-build 16 --asset-manifest dist/release-assets.json "${review_options[@]}"
      - name: Publish release or stage private draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          STAGE_DRAFT: ${{ inputs.stage_draft }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [[ "$STAGE_DRAFT" == "true" && "$PUBLISH_RELEASE" == "true" ]]; then
            echo "Refusing conflicting release modes." >&2
            exit 1
          fi
          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v1.0.3" --jq '.[] | select(.ref == "refs/tags/v1.0.3") | .ref')"
          existing_release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.0.3") | .id')"
          if [[ -n "$existing_tag" || -n "$existing_release" ]]; then
            echo "Refusing to replace an existing v1.0.3 tag or release." >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          ## Codex Notch Meter v1.0.3

          ### 中文

          此候选版本针对 v1.0.2 安装后仍然抖动、无按键划过未触发，以及闭合音乐外壳过高的反馈。先前的合成验证没有证明这些实机问题已经解决；以下是本次修订范围，验证状态另列于后。

          - 鼠标观察保留收到的 `NSEvent` 坐标和时间戳，避免用回调执行时的全局鼠标位置替换原始轨迹。轮询后备与事件样本分开处理，减少重复或过时采样干扰。
          - 无按键划过覆盖完整的闭合高度；左向右选择可用歌词，反向关闭。普通悬停以累计位移和停留判断，移动中的指针及手势后的邻近移动不应立即抢占为详情。
          - 闭合音乐状态与普通闭合状态保持相同高度，只横向加宽以容纳封面与播放指示；展开歌词和详情仍有各自高度。相机避让区域与可见外壳分别处理。
          - 外壳、配件和额度轮廓使用同一几何/进度修订；保留 v1.0.0 的显示时钟、弹簧和先发布后调整窗口的顺序，不额外改变已知基线调度。
          - 保留歌词 B 布局、五款皮肤、默认关闭的可选音乐/在线匹配，以及额度提示优先与已选 2/4/6 秒可读停留。

          ### English

          This candidate addresses reports that v1.0.2 still jitters, misses button-free crossings, and makes the closed music shell too tall. Earlier synthetic validation did not establish that those physical-device issues were resolved. The changes under validation are:

          - Preserve each observed `NSEvent` coordinate and timestamp instead of replacing its path with the global pointer position when the callback runs. Keep polling fallback separate from event samples to limit duplicate or stale input interference.
          - Recognize button-free crossings throughout the closed shell's height: left-to-right selects eligible lyrics and the reverse closes them. Ordinary hover uses cumulative displacement and dwell, so a moving pointer or adjacent post-gesture movement should not immediately take over as details.
          - Give closed music the same height as ordinary closed mode, with width added for artwork and the playback indicator. Expanded lyrics and details retain their own heights. Handle camera exclusion separately from the visible shell.
          - Use one geometry/progress revision for the shell, accessories and quota perimeter while preserving v1.0.0's display clock, spring and publish-before-resize order, without adding a scheduler change to the established baseline.
          - Retain the B lyric layout, all five skins, default-off optional Music/online matching, quota-notice priority and the selected 2/4/6-second readable holds.

          ### Validation and limits / 验证与边界

          v1.0.3/build 16 is a candidate until the exact source passes the complete macOS workflow, the native images and receipts are reviewed, and the source-bound ZIP/DMG bytes are verified. At preparation time, native validation and publication are pending. The previous v1.0.2 run is historical evidence only; it is not a pass for v1.0.3 or proof of a user-device fix. Observed results belong in the source-linked workflow and `docs/VALIDATION.md`.

          A separate native comparison runs the same synthetic controller-level input plan against the fixed v1.0.0 source and candidate for ordinary hover, steady music and playback changes. It preserves each version's own production geometry and behavior; v1.0.0 has no compact artwork wings or directional lyric mode. This comparison does not replace event-ingress verification or establish a perceptual jitter fix.

          The added verification is intended to exercise the app's real local event-monitor entry through its own `NSApp.postEvent` queue, record motion-frame history, and compare ordinary/music closed-shell pixels at the active native backing scale with simulated camera masks, alongside 1x/2x geometry tests. These are synthetic own-app events, geometry and captures, not real user-pointer input, physical-notch measurements or GPU scanout. They do not establish every Music/TCC/streaming configuration, macOS 13 runtime, or login/reboot behavior. No user's Mac, account, Music library or screen is used by these fixtures.

          v1.0.3/build 16 在对应源代码通过完整 macOS 工作流、原生图片和回执审核，以及绑定源代码的 ZIP/DMG 字节验证之前，均为候选版本。本文准备时，原生验证和发布尚未完成；v1.0.2 的历史验证不能视作本版通过，也不能证明用户实机问题已修复。新增验证计划从应用自身事件队列经过真实本地鼠标观察入口，并记录运动帧历史、比较当前原生显示比例下普通与音乐闭合像素及模拟相机遮挡，另以几何测试覆盖 1x/2x。它仍不等于真实鼠标输入、实物刘海测量或 GPU 扫描输出，也不覆盖全部 Music 权限/流媒体组合、macOS 13 运行及真实登录/重启。

          另设同输入原生 A/B：固定 v1.0.0 源码与候选分别执行普通悬停、稳定音乐、播放变化三组控制器级合成计划。保留各版自己的生产几何和行为，不能给 v1.0.0 虚构封面侧翼或手势模式，也不能将这项比较当作真实事件入口或主观流畅度已经通过。

          需要 macOS 13+，Universal DMG/ZIP 包含 Apple Silicon 与 Intel 二进制。仅 ad-hoc 签名，没有 Developer ID 签名或公证；macOS 可能阻止启动。本项目不提供绕过安全检查的指令。可选歌词与在线匹配仍默认关闭，LRCLIB 需要单独同意发送当前歌曲信息，社区歌词不等于 Apple 官方歌词。

          Requires macOS 13+. Universal DMG/ZIP contains Apple Silicon and Intel binaries. Ad-hoc signed only, without Developer ID signing or notarization; macOS may block launch. No security-bypass instructions are provided. Optional lyrics and online lookup remain off by default; LRCLIB metadata sharing requires separate consent, and community lyrics are not Apple official lyrics.
          NOTES
          # Atomic ref creation prevents a concurrent run from reusing this version.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v1.0.3" -f sha="$RELEASE_COMMIT" --silent
          release_options=()
          review_assets=()
          if [[ "$STAGE_DRAFT" == "true" ]]; then
            release_options+=(--draft)
            review_assets=(dist/perimeter-*.png)
          fi
          gh release create v1.0.3 \
            "${release_options[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v1.0.3 · Music Interaction Fix" \
            --notes-file notes.md \
            dist/CodexNotchMeter-1.0.3-universal.zip \
            dist/CodexNotchMeter-1.0.3-universal.zip.sha256 \
            dist/CodexNotchMeter-1.0.3-universal.dmg \
            dist/CodexNotchMeter-1.0.3-universal.dmg.sha256 \
            dist/release-source.json \
            dist/release-assets.json \
            "${review_assets[@]}"
