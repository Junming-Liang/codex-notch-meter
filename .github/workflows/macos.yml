name: macOS build and release
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish v1.1.1 DMG and ZIP after all checks pass
        type: boolean
        required: true
        default: false
      stage_draft:
        description: Stage this successful run's exact assets and synthetic PNGs as a private draft for review
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixed v1.0.0 comparison is archived locally, never substituted.
          fetch-depth: 0
          persist-credentials: false
      - name: Reject conflicting release modes
        if: ${{ inputs.publish_release && inputs.stage_draft }}
        run: |
          echo "publish_release and stage_draft are mutually exclusive." >&2
          exit 1
      - name: Toolchain
        run: swift --version
      - name: Public source checks
        run: python3 Scripts/check-source.py
      - name: Release source binding safety tests
        run: python3 Scripts/test-verify-release-source.py
      - name: Synthetic Music dictionary discovery safety tests
        run: python3 Scripts/test-music-dictionary.py
      - name: Inspect public Music scripting dictionary without launch
        run: python3 Scripts/check-music-dictionary.py
      - name: Synthetic unit and subprocess tests
        run: swift test
      - name: Installer safety simulations
        run: python3 Scripts/test-build-dmg.py
      - name: Build and verify universal app
        id: package
        run: bash Scripts/build-app.sh --universal
      - name: Native demo startup and orderly-exit smoke test
        run: |
          python3 - <<'PYSMOKE'
          import subprocess
          for scenario in ([], ["--smoke-empty"], ["--smoke-many"], ["--rainbow"]):
              process = subprocess.Popen(
                  ["dist/Codex Notch Meter.app/Contents/MacOS/CodexNotchMeter", "--smoke-test", *scenario],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              try:
                  stdout, stderr = process.communicate(timeout=25)
              except subprocess.TimeoutExpired:
                  # Sample only our still-owned synthetic app; do not alter the success deadline.
                  print("Native smoke exceeded the 25-second deadline", flush=True)
                  try:
                      sample = subprocess.run(
                          ["/usr/bin/sample", str(process.pid), "1", "1"],
                          capture_output=True, text=True, timeout=5,
                      )
                      print(sample.stdout[:30000])
                      print(sample.stderr[:2000])
                  except (OSError, subprocess.TimeoutExpired) as error:
                      print("Owned-process stack sample unavailable:", type(error).__name__)
                  finally:
                      process.kill()
                      stdout, stderr = process.communicate(timeout=5)
                  print(stdout)
                  print(stderr)
                  raise SystemExit("Native app smoke test timed out")
              print(stdout)
              print(stderr)
              if process.returncode != 0:
                  raise SystemExit("Native app smoke test exited unsuccessfully")
              if "SMOKE_OK: native island geometry, expansion and orderly shutdown completed; demo-only" not in stdout:
                  raise SystemExit("Native app smoke test did not confirm startup and orderly exit")
          PYSMOKE
      - name: Native transparent contour and live-update pixel gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-contour.py
      - name: Raw-edge native alignment and calibration gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-alignment.py
      - name: Native hover cadence and continuous reversal gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-motion.py
      - name: Native ordinary hover and interrupted-width handoff gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-ordinary.py --self-test
          python3 Scripts/check-native-ordinary.py
      - name: Native close endpoint and tail-pixel gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-collapse.py
      - name: Native compact refresh and promotion gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-updates.py --self-test
          python3 Scripts/check-native-updates.py
      - name: Native optional Music lyrics safety and priority gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-music.py
      - name: Native v1.0.3 lyrics recovery regression red-green gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-lyrics-recovery.py --self-test
          python3 Scripts/check-native-lyrics-redgreen.py --self-test
          python3 Scripts/check-native-lyrics-redgreen.py
      - name: Native rejected lyric gesture recovery red-green gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-gesture-recovery.py --self-test
          python3 Scripts/check-native-gesture-recovery.py --red-green
      - name: Native Music render cache and event-poll recovery gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-music-cache.py --self-test
          python3 Scripts/check-native-music-cache.py
      - name: Native queued pointer ingress and closed music height gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-pointer.py --self-test
          python3 Scripts/check-native-pointer.py
      - name: Native v1.0.0 same-input animation comparison
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: |
          python3 Scripts/check-native-baseline.py --self-test
          python3 Scripts/check-native-baseline.py
      - name: Native display compatibility and lifecycle gate
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/check-native-displays.py
      - name: Build and inspect drag-to-Applications installer
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python3 Scripts/build-dmg.py
      - name: Retain synthetic native rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodexNotchMeter-native-contour-evidence
          path: dist/contour-rendering/**/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified developer preview
        uses: actions/upload-artifact@v4
        with:
          name: CodexNotchMeter-developer-preview
          path: |
            dist/CodexNotchMeter-1.1.1-universal.zip
            dist/CodexNotchMeter-1.1.1-universal.zip.sha256
            dist/CodexNotchMeter-1.1.1-universal.dmg
            dist/CodexNotchMeter-1.1.1-universal.dmg.sha256
            dist/release-source.json
          if-no-files-found: error
          retention-days: 7
  official-desktop:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only signed official desktop helper discovery
        run: python3 Scripts/inspect-official-desktop.py
  release:
    if: ${{ inputs.publish_release || inputs.stage_draft }}
    needs: [build, official-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CodexNotchMeter-developer-preview
          path: dist
      - uses: actions/download-artifact@v4
        if: ${{ inputs.stage_draft }}
        with:
          name: CodexNotchMeter-native-contour-evidence
          path: dist/evidence
      - name: Prepare synthetic review images
        if: ${{ inputs.stage_draft }}
        run: |
          python3 - <<'PYPNG'
          from pathlib import Path
          import shutil
          sources = sorted(Path("dist/evidence").rglob("perimeter-*.png"))
          expected = {f"perimeter-{state}-{theme}.png" for state in ("compact", "details", "details-no-wings")
                      for theme in ("standard", "rainbow", "aurora", "sunset", "ice")}
          expected |= {f"perimeter-motion-{direction}-{i}.png" for direction in ("open", "close") for i in (1, 2, 3)}
          expected |= {f"perimeter-ordinary-{direction}-{i}.png" for direction in ("open", "close") for i in (1, 2, 3)}
          expected |= {f"perimeter-indicator-{state}.png" for state in ("playing-a", "playing-b", "paused", "reduced-motion")}
          expected.add("perimeter-closed-artwork.png")
          expected |= {f"perimeter-closed-height-{state}-raw-mask.png" for state in ("normal", "music")}
          if len(sources) != len(expected) or {p.name for p in sources} != expected:
              raise SystemExit("Exact synthetic review PNG set is missing or duplicated")
          for source in sources:
              if source.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("Invalid PNG signature")
              shutil.copyfile(source, Path("dist") / source.name)
          PYPNG
      - name: Verify archive checksum
        working-directory: dist
        run: |
          sha256sum --check CodexNotchMeter-1.1.1-universal.zip.sha256
          sha256sum --check CodexNotchMeter-1.1.1-universal.dmg.sha256
      - name: Verify exact source and asset manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          STAGE_DRAFT: ${{ inputs.stage_draft }}
        run: |
          review_options=()
          if [[ "$STAGE_DRAFT" == "true" ]]; then review_options+=(--require-review-images); fi
          python3 Scripts/verify-release-source.py --source-commit "$RELEASE_COMMIT" --source-run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY" --checkout . --dist dist --version 1.1.1 --bundle-build 18 --asset-manifest dist/release-assets.json "${review_options[@]}"
      - name: Publish release or stage private draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          STAGE_DRAFT: ${{ inputs.stage_draft }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [[ "$STAGE_DRAFT" == "true" && "$PUBLISH_RELEASE" == "true" ]]; then
            echo "Refusing conflicting release modes." >&2
            exit 1
          fi
          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v1.1.1" --jq '.[] | select(.ref == "refs/tags/v1.1.1") | .ref')"
          existing_release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.1.1") | .id')"
          if [[ -n "$existing_tag" || -n "$existing_release" ]]; then
            echo "Refusing to replace an existing v1.1.1 tag or release." >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          ## Codex Notch Meter v1.1.1

          ### 中文

          v1.1.1/build 18 是针对音乐手势回退和重复渲染工作的候选版本。macOS 原生验证和人工图片审核尚未完成，不能据此认定用户实机问题已修复。变更与验收范围如下：

          - 向右划过尝试打开歌词时，若当前歌词不可用，释放本次失败打开对悬停的占用，让停留不动的鼠标重新进入普通额度悬停流程；已经打开的歌词失去展示资格时，也只释放这类失效的歌词打开占用。保留成功反向手势的语义和额度通知优先级。
          - 封面未变化时复用一份已生成的 CGImage，歌词高度测量最多缓存两项，并按歌曲、文字布局条件、宽度和字体样式区分；避免每个动画帧重复生成相同资源，不保留无界历史。
          - 相同的已发布展示字段不再重复发布，同时仍处理新播放快照、更新新鲜度与计时器，并保留暂停、失效、权限拒绝及跨曲切换的隐藏边界。
          - 保留现有音乐动画轨迹、时序和尺寸；本版不声称动画体感已经更流畅，也不声称全部歌词缺失、Music 权限或流媒体问题已解决。
          - 右侧播放指示改为轻微跳动的三条音频柱，仅表示播放状态，不分析音频或显示真实频谱。只在新鲜播放且图标可见时运行；暂停、过期、隐藏时停止，并尊重减少动态效果设置。动效局限于图标图层，不驱动整个窗口布局。
          - 可选音乐与在线匹配仍默认关闭。向 LRCLIB 发送当前歌曲信息仍需单独同意，社区歌词不等于 Apple 官方歌词。

          ### English

          v1.1.1/build 18 is a candidate targeting music gesture fallback and repeated rendering work. Native macOS validation and human image review are pending; these changes do not establish that the user's Mac is fixed. Changes and verification scope:

          - When a rightward lyric-open gesture is rejected because lyrics are unavailable, release that failed open's hover ownership so a stationary pointer can resume ordinary quota hover. If an opened lyric presentation later loses eligibility, release only that lost lyric-open ownership. Preserve successful reverse-gesture behavior and quota-notice priority.
          - Reuse one prepared CGImage while artwork is unchanged and cache at most two lyric-height measurements, distinguished by track, text-layout conditions, width and font style. Avoid recreating identical resources on each animation frame without retaining unbounded history.
          - Deduplicate identical published presentation fields while continuing to process fresh playback snapshots, update freshness and timers, and preserve hiding boundaries for pause, invalidation, denied permission and track changes.
          - Retain the existing music animation trajectory, timing and dimensions. This version does not claim improved perceptual smoothness or that all missing-lyrics, Music permission or streaming issues are resolved.
          - The right-side playing indicator uses three gently moving bars to represent playback state, without audio analysis or a real spectrum. It runs only during fresh playback while visible, stops when paused, stale or hidden, and respects Reduce Motion. Animation stays within the icon layers rather than driving window layout.
          - Optional Music and online matching remain off by default. Sending current-track metadata to LRCLIB still requires separate consent, and community lyrics are not Apple official lyrics.

          ### Validation and limits / 验证与边界

          本候选版本仍须完成最终对应源代码的完整 macOS 工作流，包括新增手势红绿回归与缓存检查、全部既有门禁、34 张原生合成图片及回执的人工审核，以及绑定源代码和 build 18 的 ZIP/DMG 字节核验。先前版本的验证仅为历史记录，不能替代 v1.1.1 的验证。静态检查、合成事件及控制器测试均不能证明用户实机已修复，也不覆盖全部 Music/TCC/流媒体组合、macOS 13 运行或真实登录/重启。实际结果应记录在对应源代码的工作流与 `docs/VALIDATION.md` 中。

          This candidate still requires the complete macOS workflow for the exact final source, including new gesture red-green regression and cache checks, every retained gate, human review of the 34 native synthetic images and receipts, and verification of the ZIP/DMG bytes bound to that source and build 18. Earlier versions' validation is historical evidence only and does not validate v1.1.1. Static checks, synthetic events and controller tests do not establish a user-device fix or cover every Music/TCC/streaming configuration, macOS 13 runtime or real login/reboot behavior. Record observed results in the source-linked workflow and `docs/VALIDATION.md`.

          需要 macOS 13+；计划的 Universal DMG/ZIP 包含 Apple Silicon 与 Intel 二进制。仅 ad-hoc 签名，没有 Developer ID 签名或公证；macOS 可能阻止启动。本项目不提供绕过安全检查的指令。

          Requires macOS 13+. The planned Universal DMG/ZIP contains Apple Silicon and Intel binaries. Ad-hoc signed only, without Developer ID signing or notarization; macOS may block launch. No security-bypass instructions are provided.
          NOTES
          # Atomic ref creation prevents a concurrent run from reusing this version.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v1.1.1" -f sha="$RELEASE_COMMIT" --silent
          release_options=()
          review_assets=()
          if [[ "$STAGE_DRAFT" == "true" ]]; then
            release_options+=(--draft)
            review_assets=(dist/perimeter-*.png)
          fi
          gh release create v1.1.1 \
            "${release_options[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v1.1.1 · Music Gesture Fallback & Render Caching" \
            --notes-file notes.md \
            dist/CodexNotchMeter-1.1.1-universal.zip \
            dist/CodexNotchMeter-1.1.1-universal.zip.sha256 \
            dist/CodexNotchMeter-1.1.1-universal.dmg \
            dist/CodexNotchMeter-1.1.1-universal.dmg.sha256 \
            dist/release-source.json \
            dist/release-assets.json \
            "${review_assets[@]}"
